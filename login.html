<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | GCM AUTOMOTORS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
    
    <!-- Firebase Compat SDK (Permite abrir dando doble clic sin servidor local) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-zinc-100 min-h-screen flex items-center justify-center p-6 bg-[url('hero.jpeg')] bg-cover bg-center">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-zinc-900/60 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center mb-2">
                <span class="text-orange-600 font-black text-3xl mr-1">//</span>
                <span class="text-white font-black text-3xl tracking-tighter">GCM</span>
            </div>
            <p class="text-orange-500 font-bold text-xs tracking-[0.3em]">AUTOMOTORS ADMIN</p>
        </div>

        <!-- Login Card -->
        <div class="glass-effect rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-zinc-900 mb-6 text-center tracking-tight">Panel de Administración</h2>
            
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Correo Electrónico</label>
                    <input type="email" id="email" required 
                        class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all"
                        placeholder="ejemplo@gcm.com">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Contraseña</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all"
                        placeholder="••••••••">
                </div>

                <div id="error-message" class="text-red-600 text-xs font-bold hidden text-center bg-red-50 p-3 rounded-lg">
                    <!-- Errores aparecerán aquí -->
                </div>

                <button type="submit" id="login-btn"
                    class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold uppercase tracking-widest text-xs hover:bg-orange-700 transition-all shadow-lg shadow-orange-600/20 active:scale-95">
                    Entrar al Panel
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-zinc-500 text-xs hover:text-orange-600 transition-colors font-medium">
                    ← Volver a la página principal
                </a>
            </div>
        </div>
        
        <p class="mt-8 text-center text-white/40 text-[10px] uppercase tracking-widest font-bold">
            © 2024 GCM AUTOMOTORS | Acceso Restringido
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
